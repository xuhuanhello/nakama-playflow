name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
      - run: ./scripts/check-compatibility.sh
      - run: make test test-race

  runtime-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
      - name: Load the plugin in the official Nakama runtime
        run: make integration
      - name: Collect container logs
        if: always()
        run: docker compose -f deploy/compose.yml logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runtime-load-logs
          path: compose.log
      - name: Shut down isolated services
        if: always()
        run: docker compose -f deploy/compose.yml down
